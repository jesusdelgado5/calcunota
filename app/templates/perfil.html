{% extends "base.html" %} {% block title %}Perfil — CalcuNota{% endblock %} {%
block content %}
<div class="max-w-xl">
  <h1 class="text-xl font-semibold text-slate-900">Perfil</h1>
  {% if is_auth %}
  <p class="text-slate-600 mt-1">Estás autenticado.</p>
  <a
    href="{{ url_for('web.dashboard') }}"
    class="inline-block mt-3 rounded-lg border border-slate-300 px-3 py-2 hover:bg-slate-50"
    >Ir al Dashboard</a
  >
  {% else %}
  <p class="text-slate-600 mt-1">Inicia sesión o crea una cuenta.</p>

  <div class="mt-4 grid gap-4">
    <div class="rounded-xl border border-slate-200 bg-white p-4">
      <h2 class="font-medium text-slate-900">Iniciar sesión</h2>
      <form method="post" action="{{ url_for('web.login') }}" class="mt-3 grid gap-3">
        <label class="text-sm text-slate-700">
          Usuario
          <input name="username" required
                 class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500" />
        </label>
        <label class="text-sm text-slate-700">
          Contraseña
          <input name="password" type="password" required
                 class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500" />
        </label>
        <button class="rounded-lg bg-brand-600 hover:bg-brand-700 text-white px-4 py-2" type="submit">
          Entrar
        </button>
      </form>
    </div>

    <div class="rounded-xl border border-slate-200 bg-white p-4">
      <h2 class="font-medium text-slate-900">Registrarse</h2>
      <form method="post" action="{{ url_for('web.register') }}" class="mt-3 grid gap-3">
        <label class="text-sm text-slate-700">
          Usuario
          <input name="username" required
                 class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500" />
        </label>
        <label class="text-sm text-slate-700">
          Contraseña
          <input name="password" type="password" required
                 class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500" />
        </label>
        <button class="rounded-lg border border-slate-300 px-4 py-2 hover:bg-slate-50" type="submit">
          Crear cuenta
        </button>
      </form>
    </div>
  </div>
  {% endif %}
</div>
{% endblock %}
